<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Deteksi Gerakan Pose</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --muted:#9a9a9a; --accent:#00d26a; --warn:#ffb020; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; min-height:100dvh; padding:0 16px 16px; }
  header { padding:14px 0 10px; }
  h1 { font-size:18px; margin:0; }
  p.sub { margin:4px 0 0; font-size:13px; color:var(--muted); }
  #panggung { position:relative; width:100%; max-width:900px; margin:0 auto; background:#000;
    border-radius:12px; overflow:hidden; aspect-ratio:4/3; }
  canvas { width:100%; height:100%; display:block; }
  #pesan { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px; font-size:15px; color:var(--muted); line-height:1.5; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding:14px 0 6px; }
  button { appearance:none; border:0; border-radius:10px; padding:12px 18px; font-size:15px;
    font-weight:600; background:var(--accent); color:#04210f; cursor:pointer; min-height:44px; }
  button.sekunder { background:#2a2a2a; color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  footer { margin-top:auto; padding-top:10px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <header>
    <h1>Deteksi Gerakan Pose</h1>
    <p class="sub">Berdiri 2-3 meter dari kamera, seluruh badan terlihat.</p>
  </header>

  <div id="panggung">
    <canvas id="kanvas"></canvas>
    <div id="pesan">Tekan <b>&nbsp;Mulai kamera&nbsp;</b> lalu izinkan akses kamera.</div>
  </div>

  <div class="bar">
    <button id="tmbMulai">Mulai kamera</button>
    <button id="tmbCermin" class="sekunder" disabled>Cermin: aktif</button>
  </div>

  <footer>Semua proses berjalan di perangkat Anda; video tidak dikirim ke mana pun.</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
